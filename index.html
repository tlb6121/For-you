```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CONFESSION</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 60px 20px 35px;
    }

    header h1 {
      font-size: clamp(42px, 8vw, 80px);
      letter-spacing: 8px;
      font-weight: 800;
    }

    header p {
      margin-top: 10px;
      color: #777;
      font-size: 15px;
    }

    /* MAIN */
    main {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* CONFESSION INPUT */
    .write-box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }

    .write-box h2 {
      margin-bottom: 15px;
      font-size: 22px;
    }

    textarea {
      width: 100%;
      height: 140px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #222;
    }

    button {
      margin-top: 15px;
      background: #111;
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #333;
    }

    /* CONFESSION GRID */
    .confessions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding-bottom: 50px;
    }

    /* CARD */
    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      min-height: 190px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    .card p {
      line-height: 1.7;
      color: #444;
      word-wrap: break-word;
    }

    .card span {
      display: block;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }

    /* TABLET */
    @media (max-width: 850px) {
      .confessions {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* MOBILE */
    @media (max-width: 550px) {

      header {
        padding-top: 40px;
      }

      header h1 {
        letter-spacing: 4px;
      }

      .write-box {
        padding: 18px;
        border-radius: 16px;
      }

      .confessions {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>CONFESSION</h1>
    <p>A place to say what you've never said.</p>
  </header>

  <main>

    <section class="write-box">
      <h2>Write your confession</h2>

      <textarea
        id="confessionInput"
        placeholder="Write something you've been keeping inside..."
      ></textarea>

      <button onclick="postConfession()">
        POST CONFESSION
      </button>
    </section>

    <section class="confessions" id="confessionList">

      <!-- SAMPLE CONFESSIONS -->

      <div class="card">
        <p>
          I still think about someone I haven't talked to in years.
        </p>
        <span>Anonymous</span>
      </div>

      <div class="card">
        <p>
          Sometimes I smile just because I remembered a good memory.
        </p>
        <span>Anonymous</span>
      </div>

      <div class="card">
        <p>
          I wish I had told them how I really felt.
        </p>
        <span>Anonymous</span>
      </div>

    </section>

  </main>

  <script>
    function postConfession() {

      const input = document.getElementById("confessionInput");
      const list = document.getElementById("confessionList");

      const confession = input.value.trim();

      if (confession === "") {
        alert("Please write a confession first.");
        return;
      }

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <p>${escapeHTML(confession)}</p>
        <span>Anonymous • Just now</span>
      `;

      list.prepend(card);

      input.value = "";
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
```
